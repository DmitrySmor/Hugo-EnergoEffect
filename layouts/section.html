{{ define "main" }}
    <div class="container pb-4">
        <header class="py-4">
            <h1 class="text-uppercase">{{ .Title }}</h1>
        </header>
        {{ with .Content }}
            <div class="row">
                <div class="col-12 col-lg-6">{{ . }}</div>
            </div>
        {{ end }}
        <div class="row">
            {{ range .Pages }}
                <div class="col-12 col-md-6 col-xl-4 col-xxl-3 mb-5">
                    <article>
                        <div class="ratio ratio-16x9 rounded-4 overflow-hidden mb-3">
                            {{ $image := .Resources.GetMatch "preview.webp" }}
                            <img class="object-fit-cover" src="{{ $image.RelPermalink }}" alt="{{ .LinkTitle }}" width="{{ $image.Width }}" height="{{ $image.Height }}" />
                        </div>
                        <h2 class="h6 lh-1">
                            <a href="{{ .RelPermalink }}">
                                {{ .LinkTitle }}
                            </a>
                        </h2>
                    </article>
                </div>
            {{ end }}
        </div>
    </div>
{{ end }}
