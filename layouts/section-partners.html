{{ define "main" }}
    <article>
        <div class="container my-4">
            <header>
                <h1 class="text-uppercase mb-4 mb-md-5">
                    {{ .Title }}
                </h1>
            </header>

            {{ with .Content }}
                <div class="row">
                    <div class="col-12 col-lg-6">{{ . }}</div>
                </div>
            {{ end }}
            <!-- Список партеров -->
            <div class="row">
                {{ range .Pages }}
                    <div class="col-12">
                        <article>
                            <h2 class="h6 lh-1">
                                <a href="{{ .RelPermalink }}">
                                    {{ .LinkTitle }}
                                </a>
                            </h2>
                        </article>
                    </div>
                {{ end }}
            </div>
        </div>
    </article>
{{ end }}
