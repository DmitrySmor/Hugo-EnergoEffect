<footer class="bg-dark py-4">
    <div class="container">
        <div class="row align-items-center">
            <!-- Логотип -->
            <div class="col-12 col-md-auto">
                <a class="footer-logo d-block" href="{{ `` | absURL }}">
                    <svg width="183" height="71" aria-hidden="true">
                        <use href="{{ `icons.svg#logofooter` | absURL }}"></use>
                    </svg>
                </a>
            </div>
            <!-- Меню показывается только с md -->
            <div class="col d-none d-md-block">
                <nav aria-label="Подвал">
                    <ul class="nav justify-content-end">
                        {{ range .Site.Menus.main }}
                            <li class="nav-item">
                                <a href="{{ .URL | absURL }}" class="nav-link footer-nav-link fw-normal lh-base px-1 px-lg-2 px-xl-3">
                                    {{ .Name }}
                                </a>
                            </li>
                        {{ end }}

                        {{ range .Site.Menus.footer }}
                            <li class="nav-item">
                                <a href="{{ .URL | absURL }}" class="nav-link footer-nav-link fw-normal lh-base px-1 px-lg-2 px-xl-3">
                                    {{ .Name }}
                                </a>
                            </li>
                        {{ end }}
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</footer>

<!-- Современный JS через js.Build -->
{{ with resources.Get "js/main.js" }}
    {{ $js := . | js.Build "js/main.js" | resources.Minify | resources.Fingerprint }}
    <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" crossorigin="anonymous" defer></script>
{{ end }}


<!-- Внутри будет весь баннер + сохранение выбора + отложенная загрузка Метрики.-->
<script src="{{ `js/cookie-consent.js` | absURL }}" defer></script>
