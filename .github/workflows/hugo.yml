# Сборка и публикация Hugo-сайта на GitHub Pages
name: Deploy Hugo site to Pages

on:
    # Запуск при push в ветку main
    push:
        branches: ['main']

    # Возможность запустить workflow вручную из вкладки Actions
    workflow_dispatch:

# Права GITHUB_TOKEN для публикации на GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Разрешаем только один одновременный деплой
concurrency:
    group: 'pages'
    cancel-in-progress: false

# По умолчанию используем Bash
defaults:
    run:
        shell: bash

jobs:
    # ==============================
    # СБОРКА HUGO-САЙТА
    # ==============================
    build:
        runs-on: ubuntu-latest

        env:
            HUGO_VERSION: 0.161.1

        steps:
            # Установка Hugo
            - name: Install Hugo CLI
              run: |
                  wget -O ${{ runner.temp }}/hugo.deb \
                    https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb

                  sudo dpkg -i ${{ runner.temp }}/hugo.deb

            # Установка Dart Sass
            - name: Install Dart Sass
              run: sudo snap install dart-sass

            # Получение исходного кода из репозитория
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            # Настройка GitHub Pages
            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@v5

            # Установка Node.js зависимостей, если они существуют
            - name: Install Node.js dependencies
              run: '[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true'

            # Создание файла подтверждения IndexNow
            # Файл создаётся только во время CI-сборки
            # и не хранится в Git-репозитории
            - name: Create IndexNow key file
              run: |
                  mkdir -p static

                  printf "%s" "${{ secrets.INDEXNOW_KEY }}" \
                    > "static/${{ secrets.INDEXNOW_KEY }}.txt"

            # Сборка сайта Hugo
            - name: Build with Hugo
              env:
                  HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
                  HUGO_ENVIRONMENT: production
              run: |
                  hugo \
                    --minify \
                    --baseURL "${{ steps.pages.outputs.base_url }}/"

            # Загрузка собранного сайта как артефакта GitHub Pages
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    # ==============================
    # ПУБЛИКАЦИЯ НА GITHUB PAGES
    # ==============================
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest

        needs: build

        steps:
            # Публикация сайта на GitHub Pages
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

    # ==============================
    # УВЕДОМЛЕНИЕ INDEXNOW
    # ==============================
    indexnow:
        runs-on: ubuntu-latest

        # Запускаем только после успешной публикации сайта
        needs: deploy

        steps:
            # Отправляем URL главной страницы в IndexNow
            - name: Notify IndexNow
              env:
                  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
                  SITE_URL: ${{ vars.SITE_URL }}

              run: |
                  # Формируем полный URL сайта
                  SITE_URL_HTTPS="https://${SITE_URL}"

                  echo "SITE_URL: $SITE_URL_HTTPS"
                  echo "HOST: $SITE_URL"

                  # Отправляем URL в IndexNow
                  curl -i \
                    -X POST "https://api.indexnow.org/indexnow" \
                    -H "Content-Type: application/json; charset=utf-8" \
                    -d "{
                      \"host\": \"$SITE_URL\",
                      \"key\": \"$INDEXNOW_KEY\",
                      \"urlList\": [
                        \"$SITE_URL_HTTPS/\"
                      ]
                    }"
