baseURL = 'https://energo-effect.pro'
locale = 'ru-RU'
defaultContentLanguage = 'ru'
title = 'ООО «Энерго Эффект»'
disableHugoGeneratorInject = true
timeZone = 'Europe/Moscow'
disableKinds = ['taxonomy','term'] # отключаем категории и теги
enableRobotsTXT = true # Включаем генрацию robots.txt

# ============================================================
# Настройки сборки Hugo
# ============================================================

[build]
  # --------------------------------------------------------
  # buildStats — статистика использования HTML-элементов
  #
  # При сборке Hugo создаёт файл hugo_stats.json со списком
  # всех тегов, классов и ID, которые встречаются в HTML.
  #
  # Этот файл используется PurgeCSS для определения того,
  # какие CSS-правила реально нужны на сайте, а какие можно
  # удалить. Без него PurgeCSS не знает, что оставить.
  #
  # ВАЖНО: hugo_stats.json не нужно коммитить в репозиторий —
  # он генерируется автоматически при каждой сборке.
  # Добавьте его в .gitignore.
  # --------------------------------------------------------
[build.buildStats]
    enable = true


# Контакты компанииё
[params]
    # ===== Компания =====
    company_fullName  = 'Общество с ограниченной ответственностью «Энерго Эффект»'
    company_shortName = 'ООО «Энерго Эффект»'
    company_brandName = 'Энерго Эффект'   # для логотипа/заголовков

    # ===== Контакты =====
    # Телефон храним в 3 видах: отображение, tel:-ссылка, Schema.org.
    # Строки, т.к. есть '+', скобки, пробелы — числами не выразить.
    company_phone01        = '8 (862) 555-12-25'      # отображаемый текст
    company_phone01_link   = '+78625551225'           # для href="tel:"
    company_phone01_schema = '+7-862-555-12-25'       # для Schema.org / микроразметки

    company_phone02        = '8 (988) 283-53-53'
    company_phone02_link   = '+79882835353'
    company_phone02_schema = '+7-988-283-53-53'

    company_emailMain    = 'energoeffect.sochi@yandex.ru'
    company_emailPoverka = '5353@energo-effect.pro'   # для заявок на поверку

    # ===== Юридические реквизиты =====
    # Все реквизиты — строки: это идентификаторы, а не числа.
    # Строки сохраняют ведущие нули и не теряют точность (ОГРН > int64).
    company_inn       = '2366037694'
    company_kpp       = '236601001'
    company_ogrn      = '1222300050136'
    company_okpo      = '93424425'
    company_okved     = '35.30.4. Обеспечение работоспособности котельных.'
    company_taxSystem = 'УСН (6% — доходы), НДС 5%'

    # ===== Банковские реквизиты =====
    # Строго строки: БИК имеет ведущий ноль (044525104),
    # счета — 20 цифр, не помещаются в int64 и теряют точность как float.
    company_bankName        = 'ООО "Банк Точка"'
    company_bankAccount     = '40702810801500151217'   # расчётный счёт
    company_bankBik         = '044525104'              # ведущий ноль!
    company_bankCorrAccount = '30101810745374525104'   # корр. счёт

    # ===== Руководство =====
    company_directorFull  = 'Каландов Сергей Николаевич'
    company_directorShort = 'С.Н. Каландов'   # для подписи

# ===== Юридический адрес (Для доккументов)  =====
[params.addressLegal]
    Street      = 'ул. Подгорная, д. 2, офис 17'
    City        = 'Сочи'
    Region      = 'Краснодарский край'
    PostalCode  = '354068'
    Country     = 'Россия'
    CountryCode = 'RU'

# ===== Почтовый адрес (Фактический) =====
[params.addressPostal]
    Street      = 'ул. Подгорная, д. 2, офис 17'
    City        = 'Сочи'
    Region      = 'Краснодарский край'
    PostalCode  = '354068'
    Country     = 'Россия'
    CountryCode = 'RU'

